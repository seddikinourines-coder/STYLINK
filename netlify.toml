[build]
  command = "pnpm --filter @workspace/stylink run build"
  publish = "artifacts/stylink/dist/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts-list"
  status = 200
  conditions = {Method = ["GET"]}

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts-create"
  status = 200
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts-delete"
  status = 200
  conditions = {Method = ["DELETE"]}

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts-edit"
  status = 200
  conditions = {Method = ["PATCH"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
